<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visualisation Sankey - Valorisation Textile</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/d3-sankey@0.12.3/dist/d3-sankey.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/i18next@23.7.11/dist/umd/i18next.min.js"></script>
    <script src="../i18n-config.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
  </head>
  <body>
    <!-- Loader simple -->
    <div
      id="loader"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.9);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
      "
    >
      <div class="loader"></div>
      <div data-i18n="loading">Chargement...</div>
    </div>

    <!-- Header avec dropdown des dimensions -->
    <div class="bg-white px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <label class="text-sm font-medium text-gray-700" data-i18n="dimension"
          >Dimension :</label
        >
        <div class="relative">
          <select
            id="dimension-select"
            class="appearance-none bg-white border border-gray-300 rounded-md px-3 py-2 pr-8 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 cursor-pointer"
            style="min-width: 140px"
          ></select>
          <div
            class="absolute inset-y-0 right-0 flex items-center pr-2 pointer-events-none"
          >
            <svg
              class="h-4 w-4 text-gray-400"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 9l-7 7-7-7"
              ></path>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <div style="position: relative">
      <div id="sankey-container"></div>
      <div
        style="display: flex; justify-content: flex-end; padding-right: 20px"
        id="save-btn-container"
      >
        <button
          id="save-scenario-btn"
          disabled
          style="
            padding: 8px 24px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.2s;
          "
        >
          <span data-i18n="save">Enregistrer</span>
        </button>
      </div>
    </div>
    <script>
      console.log('[HTML] script chargé');

      // Initialiser i18next
      const params = getUrlParams();

      i18next
        .init({
          ...window.i18nConfig,
          lng: params.lang,
          fallbackLng: 'fr_fr',
          debug: true,
        })
        .then(() => {
          updateTranslations();

          // Marquer i18next comme prêt pour les autres scripts
          window.i18nextReady = true;
        })
        .catch(error => {
          console.error('[HTML] Error initializing i18next:', error);
        });

      // Fonction pour mettre à jour les traductions
      function updateTranslations() {
        document.querySelectorAll('[data-i18n]').forEach(el => {
          const key = el.getAttribute('data-i18n');
          el.textContent = i18next.t(key);
        });

        // Déclencher un événement pour notifier les autres scripts
        window.dispatchEvent(
          new CustomEvent('languageChanged', {
            detail: { language: i18next.language },
          })
        );
      }

      // Variables globales
      // currentDimension supprimée - on utilise window.currentDimension
      let dimensions = [
        { value: 'formats', label: 'Formats' },
        { value: 'types', label: 'Types' },
        { value: 'matieres', label: 'Matières' },
        { value: 'fibres', label: 'Fibres' },
        { value: 'couleurs', label: 'Couleurs' },
        { value: 'perturbateurs', label: 'Perturbateurs' },
        { value: 'qualite', label: 'Qualité' },
        { value: 'proprete', label: 'Propreté' },
      ];

      // Fonction pour charger les dimensions depuis Bubble
      async function loadDimensionsFromBubble(isLive) {
        try {
          console.log(
            '[HTML] Chargement des dimensions depuis Bubble, isLive:',
            isLive
          );

          const response = await fetch('/api/bubble', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              endpoint: 'dimensions',
              params: { isLive },
              method: 'GET',
            }),
          });

          if (!response.ok) {
            throw new Error(`Erreur API: ${response.status}`);
          }

          const bubbleDimensions = await response.json();
          console.log(
            '[HTML] Dimensions récupérées depuis Bubble:',
            bubbleDimensions
          );

          // Transformer les données Bubble en format attendu
          if (bubbleDimensions && typeof bubbleDimensions === 'object') {
            // Si c'est un objet, convertir en array
            if (Array.isArray(bubbleDimensions)) {
              dimensions = bubbleDimensions.map(dim => ({
                value: dim.value || dim.name || dim.id,
                label: dim.label || dim.title || dim.name || dim.id,
              }));
            } else {
              // Si c'est un objet avec des clés, convertir en array
              const params = getUrlParams();
              const lang = params.lang || 'fr_fr';
              dimensions = Object.keys(bubbleDimensions).map(key => ({
                value: key,
                label:
                  bubbleDimensions[key][lang] ||
                  bubbleDimensions[key].fr_fr ||
                  key, // Utiliser la traduction selon la langue
              }));
            }

            console.log('[HTML] Dimensions transformées:', dimensions);
          } else {
            console.log(
              '[HTML] Aucune dimension reçue de Bubble, utilisation des dimensions par défaut'
            );
          }
        } catch (error) {
          console.error(
            '[HTML] Erreur lors du chargement des dimensions:',
            error
          );
          console.log('[HTML] Utilisation des dimensions par défaut');
          // Garder les dimensions par défaut en cas d'erreur
        } finally {
          // Toujours mettre à jour le dropdown, même en cas d'erreur
          updateDimensionDropdown();
        }
      }

      // Fonction pour mettre à jour le dropdown des dimensions
      function updateDimensionDropdown() {
        const select = document.getElementById('dimension-select');
        if (!select) return;

        // Sauvegarder la valeur actuelle
        const currentValue = select.value;

        // Vider le select
        select.innerHTML = '';

        // Ajouter les nouvelles options
        const params = getUrlParams();
        const lang = params.lang || 'fr_fr';
        dimensions.forEach(dim => {
          const option = document.createElement('option');
          option.value = dim.value;
          // Si dim.label est un objet avec traductions, utiliser la langue appropriée
          option.textContent =
            typeof dim.label === 'object'
              ? dim.label[lang] || dim.label.fr_fr || dim.value
              : dim.label;
          select.appendChild(option);
        });

        // Restaurer la valeur actuelle si elle existe encore, sinon prendre la première
        if (dimensions.find(d => d.value === currentValue)) {
          select.value = currentValue;
        } else if (dimensions.length > 0) {
          select.value = dimensions[0].value;
        }
      }

      // Fonction utilitaire pour lire les paramètres d'URL
      function getUrlParams() {
        const urlParams = new URLSearchParams(window.location.search);
        return {
          lang: urlParams.get('lang') || 'fr_fr',
          dimension: 'formats', // Dimension par défaut, plus de paramètre dans l'URL
          scenarioId: urlParams.get('scenarioId') || '',
          lotId: urlParams.get('lotId') || '',
          teamId: urlParams.get('teamId') || '',
          isLive: urlParams.get('isLive') === 'true',
          isEditable: urlParams.get('isEditable') === 'true', // false par défaut
        };
      }

      // Fonction pour gérer l'état du bouton Enregistrer
      function setScenarioModifie(modifie) {
        const saveBtn = document.getElementById('save-scenario-btn');
        window._scenarioModifie = !!modifie;
        if (saveBtn) {
          saveBtn.disabled = !modifie;
          saveBtn.style.opacity = modifie ? '1' : '0.5';
        }
      }

      function collectCdcIdsFromScenario(scenario) {
        const cdcIds = new Set();

        function visit(node) {
          if (!node || typeof node !== 'object') return;

          if (Array.isArray(node)) {
            node.forEach(visit);
            return;
          }

          // Cas transformation classique: transformation.scenario.target
          if (
            node.scenario &&
            typeof node.scenario === 'object' &&
            typeof node.scenario.target === 'string' &&
            node.scenario.target.trim() !== ''
          ) {
            cdcIds.add(node.scenario.target.trim());
          }

          // Cas coproduct_scenario: target + title au même niveau
          if (
            typeof node.target === 'string' &&
            node.target.trim() !== '' &&
            typeof node.title === 'string'
          ) {
            cdcIds.add(node.target.trim());
          }

          Object.keys(node).forEach(key => {
            visit(node[key]);
          });
        }

        visit(scenario);
        return cdcIds;
      }

      function setSavedScenarioCdcIds(idsSet) {
        window._savedScenarioCdcIds = Array.from(idsSet || []);
      }

      function getSavedScenarioCdcIds() {
        const saved = Array.isArray(window._savedScenarioCdcIds)
          ? window._savedScenarioCdcIds
          : [];
        return new Set(saved);
      }

      async function syncScenarioCdcDiffAfterSave(currentScenario) {
        if (!currentScenario || typeof currentScenario !== 'object') return;

        const savedIds = getSavedScenarioCdcIds();
        const currentIds = collectCdcIdsFromScenario(currentScenario);

        const toAdd = Array.from(currentIds).filter(id => !savedIds.has(id));
        const toRemove = Array.from(savedIds).filter(id => !currentIds.has(id));

        if (typeof syncScenarioCdc !== 'function') {
          console.warn(
            '[HTML] syncScenarioCdc indisponible, skip sync CDC post-save',
            { toAdd, toRemove }
          );
          setSavedScenarioCdcIds(currentIds);
          return;
        }

        for (const cdcId of toRemove) {
          try {
            await syncScenarioCdc('remove', cdcId);
          } catch (err) {
            console.error('[HTML] remove_cdc échoué', { cdcId, err });
          }
        }

        for (const cdcId of toAdd) {
          try {
            await syncScenarioCdc('add', cdcId);
          } catch (err) {
            console.error('[HTML] add_cdc échoué', { cdcId, err });
          }
        }

        setSavedScenarioCdcIds(currentIds);
      }

      // Fonction pour lancer le Sankey avec une dimension spécifique
      async function launchSankeyFromUrl(lot, scenario, dimension = null) {
        const params = getUrlParams();
        window.currentDimension = dimension || params.dimension;

        console.log('[HTML] Lancement Sankey avec:', {
          lot,
          scenario,
          dimension: window.currentDimension,
          availableScenarios: window.scenarios?.length || 0,
        });

        // Charger la LISTE des transformations dynamiques (sans détails)
        try {
          console.log(
            '[HTML] Chargement de la liste des transformations dynamiques...'
          );

          // Vérifier si window.transformationUtils existe (processes.js chargé)
          if (
            window.transformationUtils &&
            typeof window.transformationUtils.getAvailableTransformations ===
              'function'
          ) {
            await window.transformationUtils.getAvailableTransformations();
            console.log(
              '[HTML] Liste des transformations dynamiques chargée avec succès'
            );
          } else {
            console.warn(
              '[HTML] transformationUtils non disponible, attente du chargement...'
            );
            // Attendre que processes.js soit chargé
            let attempts = 0;
            while (!window.transformationUtils && attempts < 50) {
              await new Promise(resolve => setTimeout(resolve, 100));
              attempts++;
            }
            if (window.transformationUtils) {
              await window.transformationUtils.getAvailableTransformations();
              console.log(
                '[HTML] Liste des transformations dynamiques chargée après attente'
              );
            } else {
              console.error('[HTML] Impossible de charger transformationUtils');
            }
          }
        } catch (error) {
          console.error(
            '[HTML] Erreur lors du chargement de la liste des transformations dynamiques:',
            error
          );
        }

        if (typeof runSankey === 'function' && lot && scenario) {
          runSankey({
            lot,
            scenario,
            containerId: 'sankey-container',
            dimension: window.currentDimension,
          });
          // Masquer le loader
          document.getElementById('loader').style.display = 'none';
        } else {
          console.error('[HTML] Impossible de lancer le Sankey:', {
            runSankeyExists: typeof runSankey === 'function',
            lotExists: !!lot,
            scenarioExists: !!scenario,
            scenarios: window.scenarios,
          });
        }
      }

      // Fonction pour charger un scénario depuis l'API Bubble
      function loadScenarioFromAPI(scenarioId, isLive) {
        console.log("[HTML] Chargement du scénario depuis l'API Bubble:", {
          scenarioId,
          isLive,
        });

        return fetch('/api/bubble', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            endpoint: 'scenario',
            params: {
              id: scenarioId,
              isLive: isLive,
            },
            method: 'POST',
          }),
        })
          .then(response => {
            if (!response.ok) {
              throw new Error(`Erreur API: ${response.status}`);
            }
            return response.json();
          })
          .then(scenario => {
            console.log('[HTML] Scénario chargé depuis API Bubble:', scenario);
            return scenario;
          })
          .catch(error => {
            console.error(
              '[HTML] Erreur lors du chargement du scénario depuis API:',
              error
            );
            // Pas de fallback vers scenario-data.js car supprimé
            throw new Error("Impossible de charger le scénario depuis l'API");
          });
      }

      document.addEventListener('DOMContentLoaded', function () {
        const params = getUrlParams();

        // Initialiser le dropdown des dimensions
        const dimensionSelect = document.getElementById('dimension-select');
        if (dimensionSelect) {
          // Définir la valeur initiale depuis les paramètres d'URL
          dimensionSelect.value = params.dimension;
          window.currentDimension = params.dimension;

          // Gestion du changement de dimension
          dimensionSelect.addEventListener('change', function () {
            const newDimension = this.value;
            console.log('[HTML] Changement de dimension:', newDimension);
            window.currentDimension = newDimension;

            // Relancer le Sankey avec la nouvelle dimension si les données sont disponibles
            if (
              window.lotType &&
              window.scenarios &&
              window.scenarios.length > 0
            ) {
              const currentScenario =
                window.scenarios[window.currentScenarioIdx];
              if (currentScenario && currentScenario.scenario) {
                launchSankeyFromUrl(
                  window.lotType,
                  currentScenario.scenario,
                  newDimension
                ).catch(error => {
                  console.error(
                    '[HTML] Erreur lors du relancement du Sankey:',
                    error
                  );
                });
              }
            }
          });
        }

        // Charger les dimensions depuis Bubble
        loadDimensionsFromBubble(params.isLive);

        // Initialiser l'état du bouton Enregistrer
        setScenarioModifie(false);

        // Afficher le bouton Enregistrer seulement si isEditable
        var saveBtnContainer = document.getElementById('save-btn-container');

        if (saveBtnContainer) {
          if (params.isEditable) {
            saveBtnContainer.style.display = 'flex';
            saveBtnContainer.style.height = '50px';
          } else {
            saveBtnContainer.style.display = 'none';
          }
        }

        // Gestion du clic sur le bouton Enregistrer
        const saveBtn = document.getElementById('save-scenario-btn');
        if (saveBtn) {
          saveBtn.addEventListener('click', async function () {
            if (window.sankeyScenario && window._scenarioModifie) {
              saveBtn.disabled = true;
              saveBtn.textContent = 'Enregistrement...';
              saveBtn.style.opacity = '0.5';
              try {
                // Récupérer le scénario avec les transformations modifiées
                const currentScenario =
                  window.scenarios &&
                  window.scenarios[window.currentScenarioIdx];
                if (!currentScenario || !currentScenario.scenario) {
                  throw new Error('Aucun scénario trouvé à sauvegarder');
                }

                const response = await fetch('/api/bubble', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    endpoint: 'save',
                    params: {
                      scenario_id: params.scenarioId,
                      lot_id: '',
                      value: JSON.stringify(currentScenario.scenario),
                      isLive: params.isLive,
                    },
                    method: 'POST',
                  }),
                });
                if (!response.ok)
                  throw new Error('Erreur API: ' + response.status);

                await syncScenarioCdcDiffAfterSave(currentScenario.scenario);

                saveBtn.textContent = 'Enregistré !';
                if (typeof setScenarioModifie === 'function') {
                  setScenarioModifie(false);
                }
                setTimeout(() => {
                  saveBtn.textContent = 'Enregistrer';
                }, 1500);
              } catch (e) {
                saveBtn.textContent = 'Erreur';
                setTimeout(() => {
                  saveBtn.textContent = 'Enregistrer';
                }, 2000);
                alert(
                  'Erreur lors de la sauvegarde du scénario : ' +
                    (e.message || e)
                );
              } finally {
                saveBtn.disabled = false;
                saveBtn.style.opacity = window._scenarioModifie ? '1' : '0.5';
              }
            }
          });
        }

        // Si on a un lotId, charger les données depuis l'API Bubble
        if (params.lotId) {
          console.log("[HTML] Chargement du lot depuis l'API Bubble:", params);

          // Appel API Bubble comme sur la page /lots
          fetch('/api/bubble', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              endpoint: 'lot',
              params: {
                id: params.lotId,
                isLive: params.isLive,
              },
              method: 'POST',
            }),
          })
            .then(response => {
              if (!response.ok) {
                throw new Error(`Erreur API: ${response.status}`);
              }
              return response.json();
            })
            .then(lot => {
              console.log('[HTML] Lot chargé depuis API Bubble:', lot);
              window.lotType = lot; // pour compatibilité temporaire

              // Maintenant charger le scénario depuis l'API
              // On utilise le scenarioId directement au lieu de l'index
              const scenarioId = params.scenarioId;
              // const scenarioIsLive = params.scenarioIsLive;

              // Charger le scénario depuis l'API Bubble
              if (scenarioId) {
                console.log(
                  '[HTML] Chargement du scénario avec ID:',
                  scenarioId
                );

                loadScenarioFromAPI(scenarioId, params.isLive)
                  .then(async scenario => {
                    console.log('[HTML] Scénario chargé, lancement du Sankey');

                    // Créer la structure window.scenarios attendue par le code
                    window.scenarios = [
                      {
                        scenario: scenario,
                        title: scenario.nom || 'Scénario',
                        bubbleId: scenarioId,
                        isLive: params.isLive,
                      },
                    ];
                    window.currentScenarioIdx = 0;
                    setSavedScenarioCdcIds(collectCdcIdsFromScenario(scenario));

                    await launchSankeyFromUrl(lot, scenario, currentDimension);
                  })
                  .catch(error => {
                    console.error(
                      '[HTML] Erreur lors du chargement du scénario:',
                      error
                    );
                    // Pas de fallback vers scenario-data.js car supprimé
                    console.error('[HTML] Impossible de charger le scénario');
                  });
              } else {
                console.error('[HTML] Pas de scenarioId fourni');
              }
            })
            .catch(error => {
              console.error(
                '[HTML] Erreur lors du chargement du lot depuis API:',
                error
              );
              // Fallback vers le lot_type.json si l'API échoue
              fetch('../data/lot_type.json')
                .then(r => r.json())
                .then(lot => {
                  window.lotType = lot;
                  console.log('[HTML] Fallback vers lot_type.json:', lot);

                  // Charger le scénario depuis l'API
                  if (params.scenarioId) {
                    loadScenarioFromAPI(params.scenarioId, params.isLive)
                      .then(async scenario => {
                        // Créer la structure window.scenarios attendue par le code
                        window.scenarios = [
                          {
                            scenario: scenario,
                            title: scenario.nom || 'Scénario',
                            bubbleId: params.scenarioId,
                            isLive: params.isLive,
                          },
                        ];
                        window.currentScenarioIdx = 0;
                        setSavedScenarioCdcIds(
                          collectCdcIdsFromScenario(scenario)
                        );

                        await launchSankeyFromUrl(
                          lot,
                          scenario,
                          currentDimension
                        );
                      })
                      .catch(error => {
                        console.error(
                          '[HTML] Erreur lors du chargement du scénario:',
                          error
                        );
                        // Pas de fallback vers scenario-data.js car supprimé
                        console.error(
                          '[HTML] Impossible de charger le scénario'
                        );
                      });
                  } else {
                    console.error('[HTML] Pas de scenarioId fourni');
                  }
                });
            });
        } else {
          // Fallback vers le lot_type.json si pas de lotId
          fetch('../data/lot_type.json')
            .then(r => r.json())
            .then(lot => {
              window.lotType = lot;
              console.log('[HTML] Lot chargé depuis lot_type.json:', lot);

              // Charger le scénario depuis l'API
              if (params.scenarioId) {
                loadScenarioFromAPI(params.scenarioId, params.isLive)
                  .then(async scenario => {
                    // Créer la structure window.scenarios attendue par le code
                    window.scenarios = [
                      {
                        scenario: scenario,
                        title: scenario.nom || 'Scénario',
                        bubbleId: params.scenarioId,
                        isLive: params.isLive,
                      },
                    ];
                    window.currentScenarioIdx = 0;
                    setSavedScenarioCdcIds(collectCdcIdsFromScenario(scenario));

                    await launchSankeyFromUrl(lot, scenario, currentDimension);
                  })
                  .catch(error => {
                    console.error(
                      '[HTML] Erreur lors du chargement du scénario:',
                      error
                    );
                    // Pas de fallback vers scenario-data.js car supprimé
                    console.error('[HTML] Impossible de charger le scénario');
                  });
              } else {
                console.error('[HTML] Pas de scenarioId fourni');
              }
            })
            .catch(error => {
              console.error('[HTML] Erreur lors du chargement du lot:', error);
            });
        }

        // Fonction utilitaire pour charger un JSON
        function fetchJSON(path) {
          return fetch(path).then(r => r.json());
        }

        // Fonction pour envoyer la hauteur au parent (mesure directe des éléments visibles)
        let lastReportedHeight = 0;
        function sendHeightToParent() {
          // Mesurer la position réelle du dernier élément visible dans le viewport
          // Utiliser getBoundingClientRect() qui donne les positions absolues dans le viewport

          const header = document.querySelector('.bg-white.px-4.py-3');
          const sankeyContainer = document.getElementById('sankey-container');
          const saveBtnContainer =
            document.getElementById('save-btn-container');
          const tabsContainer = document.getElementById('tabs-container');
          const costsTable = document.getElementById('costs-table');

          // Trouver le bas du dernier élément visible
          let bottomMost = 0;

          // 1. Header
          if (header) {
            const rect = header.getBoundingClientRect();
            bottomMost = Math.max(bottomMost, rect.bottom);
          }

          // 2. SVG dans sankey-container
          if (sankeyContainer) {
            const svg = sankeyContainer.querySelector('svg');
            if (svg) {
              const rect = svg.getBoundingClientRect();
              bottomMost = Math.max(bottomMost, rect.bottom);
            } else {
              // Si pas de SVG, utiliser le container lui-même
              const rect = sankeyContainer.getBoundingClientRect();
              bottomMost = Math.max(bottomMost, rect.bottom);
            }
          }

          // 3. Save button container
          if (
            saveBtnContainer &&
            getComputedStyle(saveBtnContainer).display !== 'none'
          ) {
            const rect = saveBtnContainer.getBoundingClientRect();
            bottomMost = Math.max(bottomMost, rect.bottom);
          }

          // 4. Onglets Coûts / Valorisation (s'il existe)
          if (
            tabsContainer &&
            getComputedStyle(tabsContainer).display !== 'none'
          ) {
            const rect = tabsContainer.getBoundingClientRect();
            bottomMost = Math.max(bottomMost, rect.bottom);
          }

          // La hauteur totale = position du bas du dernier élément par rapport au haut du document
          // On ajoute scrollY pour avoir la position absolue si on a scrollé
          const scrollY = window.scrollY || 0;
          const realContentHeight = bottomMost + scrollY;

          const SAFETY = 50; // Marge de sécurité réduite
          const MIN_H = 400;
          const MAX_H = 6000;

          const height = Math.min(
            MAX_H,
            Math.max(MIN_H, realContentHeight + SAFETY)
          );

          if (height < 500) {
            console.log('[Height] Mesure ignorée (<500px):', height);
            return;
          }

          // Éviter d'envoyer la même hauteur plusieurs fois (évite les boucles)
          if (Math.abs(height - lastReportedHeight) < 10) {
            return; // Pas de changement significatif
          }

          lastReportedHeight = height;

          console.log('[Height] Calculé:', {
            bottomMost,
            scrollY,
            realContentHeight,
            finalHeight: height,
            headerBottom: header ? header.getBoundingClientRect().bottom : 0,
            svgBottom:
              sankeyContainer && sankeyContainer.querySelector('svg')
                ? sankeyContainer.querySelector('svg').getBoundingClientRect()
                    .bottom
                : 0,
            saveBottom: saveBtnContainer
              ? saveBtnContainer.getBoundingClientRect().bottom
              : 0,
            costsTableBottom: costsTable
              ? costsTable.getBoundingClientRect().bottom
              : 0,
          });

          window.parent.postMessage({ type: 'IFRAME_HEIGHT', height }, '*');
        }
        // Exposer la fonction pour que d'autres scripts puissent déclencher un resize (ex: après rendu Sankey)
        window._resizeIframe = sendHeightToParent;
        window.addEventListener('load', sendHeightToParent);
        window.addEventListener('resize', sendHeightToParent);

        // Hook sur les mutations du DOM pour resize auto avec debounce
        // DÉSACTIVÉ : Le MutationObserver créait une boucle infinie car il détectait
        // les changements de style causés par le resize de l'iframe
        // On compte sur les appels explicites depuis sankey.js après rendu
        /*
        let resizeTimeout;
        const observer = new MutationObserver(() => {
          clearTimeout(resizeTimeout);
          resizeTimeout = setTimeout(() => {
            sendHeightToParent();
          }, 100);
        });
        observer.observe(document.body, {
          childList: true,
          subtree: true,
          attributes: true,
          attributeFilter: ['style'],
        });
        */
      });
    </script>
